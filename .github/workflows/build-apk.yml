name: Build TVNoDPI APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout wrapper repository
        uses: actions/checkout@v4

      - name: Checkout ByeByeDPI upstream
        uses: actions/checkout@v4
        with:
          repository: romanvht/ByeByeDPI
          path: upstream
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: upstream/**/*.gradle*

      - name: Apply TVNoDPI TV interface
        shell: bash
        run: |
          set -euxo pipefail
          cp tv/activity_main.xml upstream/app/src/main/res/layout/activity_main.xml

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('upstream')
          changed = 0
          for p in root.rglob('strings.xml'):
              try:
                  s = p.read_text(encoding='utf-8')
              except Exception:
                  continue
              if 'name="app_name"' in s:
                  n = re.sub(
                      r'<string name="app_name">.*?</string>',
                      '<string name="app_name">TVNoDPI</string>',
                      s
                  )
                  if n != s:
                      p.write_text(n, encoding='utf-8')
                      changed += 1
          print('renamed string files:', changed)

          # TV usability: put focus on the large power button when the screen opens.
          main = root / 'app/src/main/java/io/github/romanvht/byedpi/activities/MainActivity.kt'
          s = main.read_text(encoding='utf-8')
          needle = '        ShortcutUtils.update(this)\n'
          if needle in s and 'binding.statusButtonCard.requestFocus()' not in s:
              s = s.replace(needle, needle + '        binding.statusButtonCard.requestFocus()\n')
          main.write_text(s, encoding='utf-8')
          PY

      - name: Build debug APKs
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Collect compatible APKs
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          echo "Built APKs:"
          find upstream/app/build/outputs/apk -type f -name '*.apk' -print

          UNIVERSAL=$(find upstream/app/build/outputs/apk -type f -name '*universal*debug*.apk' | head -n1 || true)
          ARM64=$(find upstream/app/build/outputs/apk -type f \( -name '*arm64-v8a*debug*.apk' -o -name '*arm64*debug*.apk' \) | head -n1 || true)

          if [ -n "$UNIVERSAL" ]; then
            cp "$UNIVERSAL" out/TVNoDPI-universal-debug.apk
          fi
          if [ -n "$ARM64" ]; then
            cp "$ARM64" out/TVNoDPI-arm64-v8a-debug.apk
          fi

          if [ ! -e out/TVNoDPI-universal-debug.apk ] && [ ! -e out/TVNoDPI-arm64-v8a-debug.apk ]; then
            cp upstream/app/build/outputs/apk/debug/*.apk out/ || true
          fi

          ls -lh out/
          test -n "$(find out -type f -name '*.apk' -print -quit)"

      - name: Upload compatible TVNoDPI APKs
        uses: actions/upload-artifact@v4
        with:
          name: TVNoDPI-TV-APK
          path: out/*.apk
          if-no-files-found: error
