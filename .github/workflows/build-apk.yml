name: Build TVNoDPI APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout wrapper repository
        uses: actions/checkout@v4

      - name: Checkout ByeByeDPI upstream
        uses: actions/checkout@v4
        with:
          repository: romanvht/ByeByeDPI
          path: upstream
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: upstream/**/*.gradle*

      - name: Rename app for TV build
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('upstream')
          changed=0
          for p in root.rglob('strings.xml'):
              try: s=p.read_text(encoding='utf-8')
              except Exception: continue
              if 'name="app_name"' in s:
                  n=re.sub(r'<string name="app_name">.*?</string>', '<string name="app_name">TVNoDPI</string>', s)
                  if n != s:
                      p.write_text(n, encoding='utf-8'); changed += 1
          print('renamed string files:', changed)
          PY

      - name: Build debug APK
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p out
          APK=$(find upstream -type f -path '*/build/outputs/apk/debug/*.apk' | head -n1)
          test -n "$APK"
          cp "$APK" out/TVNoDPI-debug.apk
          ls -lh out/TVNoDPI-debug.apk

      - name: Upload TVNoDPI APK
        uses: actions/upload-artifact@v4
        with:
          name: TVNoDPI-APK
          path: out/TVNoDPI-debug.apk
          if-no-files-found: error
