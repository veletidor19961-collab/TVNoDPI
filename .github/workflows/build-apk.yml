name: Build TVNoDPI APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout wrapper repository
        uses: actions/checkout@v4

      - name: Checkout ByeByeDPI upstream
        uses: actions/checkout@v4
        with:
          repository: romanvht/ByeByeDPI
          path: upstream
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: upstream/**/*.gradle*

      - name: Apply TVNoDPI TV interface
        shell: bash
        run: |
          set -euxo pipefail
          cp tv/activity_main.xml upstream/app/src/main/res/layout/activity_main.xml
          cp tv/activity_main.xml upstream/app/src/main/res/layout-land/activity_main.xml
          cp tv/menu_main.xml upstream/app/src/main/res/menu/menu_main.xml
          cp tv/main_settings.xml upstream/app/src/main/res/xml/main_settings.xml
          cp tv/MainSettingsFragment.kt upstream/app/src/main/java/io/github/romanvht/byedpi/fragments/MainSettingsFragment.kt
          python3 tv/patch_main.py upstream

      - name: Build debug APKs
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Collect compatible APKs
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          find upstream/app/build/outputs/apk -type f -name '*.apk' -print
          UNIVERSAL=$(find upstream/app/build/outputs/apk -type f -name '*universal*debug*.apk' | head -n1 || true)
          ARM64=$(find upstream/app/build/outputs/apk -type f \( -name '*arm64-v8a*debug*.apk' -o -name '*arm64*debug*.apk' \) | head -n1 || true)
          if [ -n "$UNIVERSAL" ]; then cp "$UNIVERSAL" out/TVNoDPI-universal-debug.apk; fi
          if [ -n "$ARM64" ]; then cp "$ARM64" out/TVNoDPI-arm64-v8a-debug.apk; fi
          if [ ! -e out/TVNoDPI-universal-debug.apk ] && [ ! -e out/TVNoDPI-arm64-v8a-debug.apk ]; then
            cp upstream/app/build/outputs/apk/debug/*.apk out/ || true
          fi
          ls -lh out/
          test -n "$(find out -type f -name '*.apk' -print -quit)"

      - name: Upload compatible TVNoDPI APKs
        uses: actions/upload-artifact@v4
        with:
          name: TVNoDPI-MINIMAL-TV-APK
          path: out/*.apk
          if-no-files-found: error
